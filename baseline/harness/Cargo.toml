[package]
name = "old-relay-baseline"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "旧中转（burncloud/burncloud）行为基线录制工具，不进 workspace。"

[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "=1.0.105"
axum = "=0.8.9"
burncloud-commerce-billing = { git = "https://github.com/burncloud/burncloud", rev = "69aedf5867b072344427a3f78ec70a7524161755" }
burncloud-database = { git = "https://github.com/burncloud/burncloud", rev = "69aedf5867b072344427a3f78ec70a7524161755" }
burncloud-identity-user = { git = "https://github.com/burncloud/burncloud", rev = "69aedf5867b072344427a3f78ec70a7524161755" }
burncloud-router = { git = "https://github.com/burncloud/burncloud", rev = "69aedf5867b072344427a3f78ec70a7524161755" }
burncloud-supply-channel = { git = "https://github.com/burncloud/burncloud", rev = "69aedf5867b072344427a3f78ec70a7524161755" }
futures-util = "=0.3.34"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
